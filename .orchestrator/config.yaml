# Cấu hình của orchestrator (schema riêng, không phải config của Codex/Claude Code).
# Mọi khóa đều có giá trị mặc định trong orch/config.py; chỉ cần ghi đè phần muốn đổi.

agents:
  planner: codex          # lập kế hoạch + chốt kế hoạch cuối
  plan_reviewer: claude   # phản biện tính khả thi
  implementer: claude     # agent duy nhất được sửa file
  code_reviewer: codex    # review diff + kết quả gates

limits:
  max_planning_rounds: 4
  max_review_rounds: 5            # số vòng implement -> review tối đa
  max_retries: 1                  # retry khi output sai JSON/schema, timeout, exit code != 0
  max_consecutive_gate_failures: 3
  agent_timeout_sec: 1800
  gate_timeout_sec: 900
  max_diff_chars: 120000          # diff dài hơn sẽ bị cắt trong prompt review
  max_gate_output_chars: 6000

permissions:
  codex: read-only                # codex exec --sandbox read-only
  claude_planning: read-only      # claude -p --tools Read,Grep,Glob
  claude_implementation: workspace-write   # claude -p --permission-mode acceptEdits + allow/deny list

quality_gates:
  require_plan_approval: true     # Codex phải chốt plan sau khi Claude chấp thuận
  require_tests_pass: true        # mọi gate required phải exit 0
  require_codex_approval: true
  stop_on_critical_issue: true    # finding 'critical' -> dừng chờ người dùng
  blocking_severities: [critical, high]
  review_on_gate_failure: false   # gates fail -> trả thẳng về implementer, không tốn lượt review

# Lệnh kiểm tra của dự án, do orchestrator tự chạy sau mỗi vòng implement.
gates:
  - name: tests
    command: python3 -m unittest discover -s tests
    required: true
    timeout_sec: 600

safety:
  allow_dirty_worktree: false     # true = cho phép implement đè lên thay đổi chưa commit
  pause_before_implement: false   # true = dừng cho người dùng duyệt plan.final.md trước khi code
  max_deleted_files: 5
  protected_paths:
    - ".orchestrator/**"
    - ".git/**"
    - ".env"
    - ".env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/secrets/**"
    - ".github/workflows/**"

codex:
  bin: codex
  model: null
  extra_args: ["--ephemeral"]

claude:
  bin: claude          # nếu không có trong PATH sẽ tự tìm bản đi kèm extension VS Code
  model: null
  max_budget_usd: null # giới hạn chi phí mỗi lần gọi Claude (USD), null = không giới hạn
  extra_args: ["--strict-mcp-config", "--no-session-persistence"]

paths:
  runs_dir: .orchestrator/runs
