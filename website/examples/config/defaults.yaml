# Every key agentduo reads, set to its built-in default (src/core/config.ts). You never need all of this:
# write only the keys you change.
agents:
  planner: codex
  plan_reviewer: claude
  implementer: claude
  code_reviewer: codex
limits:
  max_planning_rounds: 4
  max_review_rounds: 5
  max_discussion_rounds: 3
  max_retries: 1
  max_consecutive_gate_failures: 3
  agent_timeout_sec: 1800
  agent_idle_timeout_sec: 900
  gate_timeout_sec: 900
  max_diff_chars: 120000
  max_gate_output_chars: 6000
quality_gates:
  require_plan_approval: true
  require_tests_pass: true
  require_codex_approval: true
  stop_on_critical_issue: true
  blocking_severities: [critical, high]
  review_on_gate_failure: false
gates: []
safety:
  pause_before_implement: false
codex:
  bin: codex
  model: null
  args: [--ephemeral]
  role_args: {}
claude:
  bin: claude
  model: null
  max_budget_usd: null
  permission_prompts: ask
  args: [--no-session-persistence]
  role_args: {}
paths:
  runs_dir: .agentduo/runs
