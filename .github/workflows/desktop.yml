# The desktop app on each OS it ships for: root checks, desktop unit/integration tests, the Electron E2E (fake CLIs),
# an unpacked package and its smoke test away from the checkout. A run counts as verification only once it passed;
# apps/desktop/VERIFICATION.md records which.
name: desktop
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/**"
      - "extensions/vscode/src/**"
      - "extensions/vscode/webview/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      # The desktop builds from the checkout's sources and toolchain: the root first, then the desktop package.
      - run: npm ci
      - run: npm ci --prefix apps/desktop
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm --prefix apps/desktop run typecheck
      - run: npm --prefix apps/desktop test
      - run: npm --prefix apps/desktop run build
      - name: E2E (Linux, under Xvfb; the harness alone opts out of Chromium's sandbox)
        if: runner.os == 'Linux'
        env:
          AGENTDUO_E2E_NO_SANDBOX: "1"
        run: xvfb-run -a npm --prefix apps/desktop run test:e2e
      - name: E2E
        if: runner.os != 'Linux'
        run: npm --prefix apps/desktop run test:e2e
      - run: npm --prefix apps/desktop run pack:dir
      # The smoke test also starts the packaged app and waits for its window: on Linux under Xvfb, and without the
      # SUID sandbox helper an unpacked (not installed) app has, so --no-sandbox for this check only.
      - name: Package smoke (Linux)
        if: runner.os == 'Linux'
        env:
          AGENTDUO_E2E_NO_SANDBOX: "1"
        run: xvfb-run -a npm --prefix apps/desktop run test:pack
      - name: Package smoke
        if: runner.os != 'Linux'
        run: npm --prefix apps/desktop run test:pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentduo-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*-unpacked/**
            apps/desktop/release/mac*/**
          if-no-files-found: ignore
          retention-days: 7
